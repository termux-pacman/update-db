name: Update db

on:
  push:
    branches:
    - main
    patch:
    - '.github/workflows/update-db.yml'
    - 'main.sh'
  pull_request:
    patch:
    - '.github/workflows/update-db.yml'
    - 'main.sh'
  schedule:
  - cron:  '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref_name }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-db:
    #runs-on: self-hosted
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target_repo: [main@aarch64,
                      main@arm,
                      main@i686,
                      main@x86_64,
                      x11@aarch64,
                      x11@arm,
                      x11@i686,
                      x11@x86_64,
                      root@aarch64,
                      root@arm,
                      root@i686,
                      root@x86_64,
                      tur@aarch64,
                      tur@arm,
                      tur@i686,
                      tur@x86_64,
                      tur-continuous@aarch64,
                      tur-continuous@arm,
                      tur-continuous@i686,
                      tur-continuous@x86_64,
                      tur-multilib@aarch64,
                      tur-multilib@arm,
                      tur-multilib@i686,
                      tur-multilib@x86_64,
                      gpkg@aarch64,
                      gpkg@arm,
                      gpkg@x86_64,
                      gpkg@i686,
                      cgct@x86_64]
      fail-fast: false
    steps:
    - name: Clone repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Set pacman tool for db
      if: runner.environment == 'github-hosted'
      uses: termux-pacman/pacman-actions@v2.7
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v6.2.1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}
    - name: Import gpg key
      if: runner.environment == 'github-hosted'
      run: |
        mkdir gk
        echo "${{ secrets.SF_GPG }}" > gk/termux-pacman.gpg
        gpg --pinentry-mode=loopback --passphrase '${{ secrets.PW_GPG }}' --import gk/termux-pacman.gpg
        echo "${{ secrets.SF_GPG_BOT }}" > gk/termux-pacman-bot.gpg
        gpg --pinentry-mode=loopback --passphrase '${{ secrets.PW_GPG_BOT }}' --import gk/termux-pacman-bot.gpg
        rm -fr gk
    - name: Update db
      id: update-db
      env:
        KEY_GPG: ${{ secrets.KEY_GPG }}
        PW_GPG: ${{ secrets.PW_GPG }}
        SFPU: ${{ secrets.SFPU }}
        DISTRIBUTION_ID: ${{ secrets.DISTRIBUTION_ID }}
        TARGET_REPO: ${{ matrix.target_repo }}
        EVENT: ${{ github.event_name }}
      run: |
        if [[ "${EVENT}" = "schedule" && "${{ github.ref_name }}" != "main" ]]; then
          echo "stop schedule outside main branch"
          exit 1
        fi
        export UPDATE_RSYNC=false
        source ./main.sh "${TARGET_REPO%%@*}" "${TARGET_REPO#*@}"
        echo "UPDATE_RSYNC_${repo}_${arch}=${UPDATE_RSYNC}" >> "$GITHUB_OUTPUT"
    - name: Clean
      if: runner.environment == 'self-hosted'
      run: rm -fr *
    outputs:
      update_rsync_main_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_main_aarch64 }}
      update_rsync_main_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_main_arm }}
      update_rsync_main_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_main_i686 }}
      update_rsync_main_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_main_x86_64 }}
      update_rsync_x11_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_x11_aarch64 }}
      update_rsync_x11_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_x11_arm }}
      update_rsync_x11_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_x11_i686 }}
      update_rsync_x11_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_x11_x86_64 }}
      update_rsync_root_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_root_aarch64 }}
      update_rsync_root_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_root_arm }}
      update_rsync_root_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_root_i686 }}
      update_rsync_root_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_root_x86_64 }}
      update_rsync_tur_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur_aarch64 }}
      update_rsync_tur_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur_arm }}
      update_rsync_tur_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur_i686 }}
      update_rsync_tur_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur_x86_64 }}
      update_rsync_tur-continuous_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-continuous_aarch64 }}
      update_rsync_tur-continuous_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-continuous_arm }}
      update_rsync_tur-continuous_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-continuous_i686 }}
      update_rsync_tur-continuous_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-continuous_x86_64 }}
      update_rsync_tur-multilib_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-multilib_aarch64 }}
      update_rsync_tur-multilib_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-multilib_arm }}
      update_rsync_tur-multilib_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-multilib_i686 }}
      update_rsync_tur-multilib_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_tur-multilib_x86_64 }}
      update_rsync_gpkg_aarch64: ${{ steps.update-db.outputs.UPDATE_RSYNC_gpkg_aarch64 }}
      update_rsync_gpkg_arm: ${{ steps.update-db.outputs.UPDATE_RSYNC_gpkg_arm }}
      update_rsync_gpkg_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_gpkg_x86_64 }}
      update_rsync_gpkg_i686: ${{ steps.update-db.outputs.UPDATE_RSYNC_gpkg_i686 }}
      update_rsync_cgct_x86_64: ${{ steps.update-db.outputs.UPDATE_RSYNC_cgct_x86_64 }}
  update-rsync:
    #runs-on: self-hosted
    runs-on: ubuntu-24.04
    needs: update-db
    steps:
    - name: Import crt
      run: |
        echo "${{ secrets.UR_SERVER_CRT }}" > ./server.crt
        echo "${{ secrets.UR_CLIENT_CRT }}" > ./client.crt
    - name: Update rsync
      env:
        UPDATE_RSYNC: ${{ toJSON(needs.update-db.outputs) }}
        EVENT: ${{ github.event_name }}
      run: |
        if jq -r '.[]' <<< "${UPDATE_RSYNC}" | grep -q '^true$'; then
          if [ "${EVENT}" = "pull_request" ]; then
            echo "Variables have successfully triggered the rsync update algorithm, testing complete"
          else
            for i in {1..5}; do
              res=$(curl -s -X POST -H "${{ secrets.UR_HEADERS }}" --cacert ./server.crt --cert ./client.crt "${{ secrets.UR_ADDRESS }}" | sed 's/\r//g')
              echo "Result: ${res}"
              if [ "${res}" = "ok" ]; then
                echo "Success"
                break
              elif [ "${res}" = "busy" ]; then
                if [ "${i}" = "5" ]; then
                  echo "The 5 time is busy, looks like something is broken"
                  exit 1
                fi
                echo "The system is busy, waiting 70 seconds ${i} times"
                sleep 70
                continue
              else
                echo "Internal error occurred"
                exit 1
              fi
            done
          fi
        else
          echo "Nothing to do"
        fi
    - name: Clean
      if: runner.environment == 'self-hosted'
      run: rm -fr *
